<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full-screen password display -->
    <div class="fullscreen-display">
        <!-- Mode switcher: body[data-mode] drives which controls/effects show -->
        <div class="mode-switch" role="tablist" aria-label="Generator mode">
            <span class="mode-thumb" aria-hidden="true"></span>
            <button class="mode-btn active" type="button" role="tab" aria-selected="true" data-mode="password">Password</button>
            <button class="mode-btn" type="button" role="tab" aria-selected="false" data-mode="username">Username</button>
        </div>
        <div class="password-content">
            <div class="password-wrap">
                <!-- Live region: announces each new password and any error -->
                <div class="password-display" id="password"
                     role="status" aria-live="polite" aria-atomic="true"></div>
            </div>
            <div class="strength-wrap">
                <div class="strength-bar-track">
                    <div id="strength-bar" role="progressbar"
                         aria-label="Password strength"
                         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
                </div>
            </div>
            <button id="copy-btn" class="btn btn-secondary">Copy</button>
        </div>
    </div>

    <!-- Pull-up settings card -->
    <div class="settings-card open" id="settings-card">
        <div class="settings-card-handle" id="settings-handle">
            <span class="handle-bar"></span>
            <span class="handle-chevron"></span>
        </div>
        <div class="settings-card-content">
            <div class="options-inner">

                <!-- Length card -->
                <div class="type-card" id="card-length">
                    <div class="length-inner">
                        <div class="length-header">
                            <span class="type-label" id="length-label">Length</span>
                            <div class="length-input-wrap">
                                <button class="length-arrow arrow-left" id="length-arrow-down" aria-label="Decrease length">&#8249;</button>
                                <input id="length-num" type="number" min="4" max="64" value="16">
                                <button class="length-arrow arrow-right" id="length-arrow-up" aria-label="Increase length">&#8250;</button>
                            </div>
                        </div>
                        <input id="length-slider" type="range" min="4" max="64" value="16">
                    </div>
                </div>

                <!-- Character type cards -->
                <div class="type-cards">

                    <div class="type-card active" id="card-upper">
                        <label class="type-card-header">
                            <div class="type-info">
                                <span class="type-label">Uppercase</span>
                                <span class="type-sub">A–Z</span>
                            </div>
                            <div class="toggle-switch">
                                <input type="checkbox" id="opt-upper" checked>
                                <div class="toggle-track"></div>
                            </div>
                        </label>
                    </div>

                    <div class="type-card active" id="card-lower">
                        <label class="type-card-header">
                            <div class="type-info">
                                <span class="type-label">Lowercase</span>
                                <span class="type-sub">a–z</span>
                            </div>
                            <div class="toggle-switch">
                                <input type="checkbox" id="opt-lower" checked>
                                <div class="toggle-track"></div>
                            </div>
                        </label>
                    </div>

                    <div class="type-card active" id="card-numbers">
                        <label class="type-card-header">
                            <div class="type-info">
                                <span class="type-label">Numbers</span>
                                <span class="type-sub">0–9</span>
                            </div>
                            <div class="toggle-switch">
                                <input type="checkbox" id="opt-numbers" checked>
                                <div class="toggle-track"></div>
                            </div>
                        </label>
                    </div>

                    <!-- Symbols — expandable options are a sibling for grid layout -->
                    <div class="type-card" id="card-symbols">
                        <div class="type-card-header" id="symbols-header">
                            <div class="type-info">
                                <span class="type-label">Symbols</span>
                                <span class="type-sub">!@#</span>
                            </div>
                            <div class="type-card-actions">
                                <button class="sym-settings-btn" id="sym-settings-btn" type="button" aria-label="Symbol settings">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                                <label class="toggle-switch" for="opt-symbols">
                                    <input type="checkbox" id="opt-symbols">
                                    <div class="toggle-track"></div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Symbol options — grid sibling so it can span full width independently -->
                    <div class="symbol-options" id="symbol-options">
                        <div class="sym-opts-inner">

                            <div class="sym-opt-row">
                                <label for="sym-pct-slider">Percent symbols</label>
                                <input id="sym-pct-slider" type="range" min="0" max="100" value="25">
                                <span class="sym-count-val" id="sym-pct-display">25%</span>
                            </div>

                            <div>
                                <div class="sym-picker-header">
                                    <span class="sym-picker-label">Included symbols</span>
                                    <div class="sym-chip-controls">
                                        <button id="sym-all">All</button>
                                        <button id="sym-none">None</button>
                                    </div>
                                </div>
                                <div class="symbol-picker" id="symbol-picker"></div>
                            </div>

                        </div>
                    </div>

                </div><!-- /type-cards -->

                <!-- Username controls — visible only in username mode. Chip
                     groups are radio-style: the .active chip is the source of
                     truth JS reads at startup. -->
                <div class="username-options" id="username-options">

                    <div class="un-grid">

                        <div class="type-card un-card" id="card-words">
                            <div class="un-card-inner">
                                <span class="type-label">Words</span>
                                <div class="length-input-wrap">
                                    <button class="length-arrow arrow-left" id="words-arrow-down" type="button" aria-label="Fewer words">&#8249;</button>
                                    <input id="words-num" type="number" min="1" max="4" value="2" aria-label="Number of words">
                                    <button class="length-arrow arrow-right" id="words-arrow-up" type="button" aria-label="More words">&#8250;</button>
                                </div>
                            </div>
                        </div>

                        <div class="type-card un-card" id="card-wordlist">
                            <div class="un-card-inner">
                                <span class="type-label" title="Curated: adjective + noun, about 500 friendly words. Dictionary: EFF wordlist, 7,772 words.">Word list</span>
                                <div class="chip-group" role="radiogroup" aria-label="Word list" data-opt="list">
                                    <button class="chip active" type="button" role="radio" aria-checked="true" data-value="curated">Curated</button>
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value="eff">Dictionary</button>
                                </div>
                            </div>
                        </div>

                    </div><!-- /un-grid -->

                    <div class="type-card un-card" id="card-format">
                        <div class="un-card-inner un-rows">
                            <div class="un-row">
                                <span class="un-row-label" id="lbl-separator">Separator</span>
                                <div class="chip-group" role="radiogroup" aria-labelledby="lbl-separator" data-opt="separator">
                                    <button class="chip active" type="button" role="radio" aria-checked="true" data-value="">None</button>
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value=" ">Space</button>
                                    <button class="chip chip-glyph" type="button" role="radio" aria-checked="false" data-value="_" aria-label="Underscore">_</button>
                                    <button class="chip chip-glyph" type="button" role="radio" aria-checked="false" data-value="-" aria-label="Hyphen">-</button>
                                    <button class="chip chip-glyph" type="button" role="radio" aria-checked="false" data-value="." aria-label="Period">.</button>
                                </div>
                            </div>
                            <div class="un-row">
                                <span class="un-row-label" id="lbl-casing">Casing</span>
                                <div class="chip-group" role="radiogroup" aria-labelledby="lbl-casing" data-opt="casing">
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value="lower">lowercase</button>
                                    <button class="chip active" type="button" role="radio" aria-checked="true" data-value="capital">Capitalized</button>
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value="camel">camelCase</button>
                                </div>
                            </div>
                            <div class="un-row">
                                <span class="un-row-label" id="lbl-digits">Number</span>
                                <div class="chip-group" role="radiogroup" aria-labelledby="lbl-digits" data-opt="digits">
                                    <button class="chip active" type="button" role="radio" aria-checked="true" data-value="0">Off</button>
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value="2">2 digits</button>
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value="4">4 digits</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="type-card un-card" id="card-required">
                        <div class="un-card-inner un-rows">
                            <div class="un-row">
                                <label class="un-row-label" for="required-words">Required</label>
                                <input id="required-words" type="text" placeholder="e.g. neo, matrix" autocomplete="off" autocapitalize="off" spellcheck="false">
                            </div>
                            <div class="un-row">
                                <span class="un-row-label" id="lbl-placement">Place</span>
                                <div class="chip-group" role="radiogroup" aria-labelledby="lbl-placement" data-opt="placement">
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value="start">Start</button>
                                    <button class="chip" type="button" role="radio" aria-checked="false" data-value="end">End</button>
                                    <button class="chip active" type="button" role="radio" aria-checked="true" data-value="random">Random</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div><!-- /username-options -->

                <button id="generate-btn" class="btn btn-primary">Generate</button>

                <footer class="app-footer">
                    <a href="/apps/" title="Back to Apps" class="rw-back-link">
                        <img src="/images/icon-rw.svg" alt="Back to Apps" class="rw-back-logo">
                    </a>
                </footer>

            </div>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="words-eff.js"></script>
    <script src="app.js"></script>
</body>
</html>
